name: Build

# master push: build only (sanity check, artifacts kept 7 days)
# tag push v*: build and publish a GitHub Release (+ latest.yml for auto-update)
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write  # needed only to upload release assets
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - run: npm ci
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - name: Package (build only)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: npm run package "--" -p never
      working-directory: ./main
    - name: Package and publish release
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: npm run package "--" -p always
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Hashes
      shell: pwsh
      run: |
        Get-Content .\main\dist\latest.yml
        Get-FileHash .\main\dist\*.exe -Algorithm SHA256 | Format-Table -AutoSize
    - uses: actions/upload-artifact@v7
      with:
        name: windows-dist
        path: |
          ./main/dist/*.exe
          ./main/dist/*.blockmap
          ./main/dist/latest.yml
        retention-days: 7
