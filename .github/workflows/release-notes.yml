name: Release notes

# Sync release-notes/<tag>.md into the body of already published GitHub Releases.
on:
  push:
    branches:
      - 'master'
    paths:
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # edit release bodies
    steps:
    - uses: actions/checkout@v6
    - name: Update release bodies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Edit by release id: a tag can have more than one release (v3.30.0 has a duplicate).
        failed=0
        gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | "\(.id) \(.tag_name)"' > releases.txt
        while read -r id tag; do
          f="release-notes/$tag.md"
          [ -f "$f" ] || { echo "skip $tag (no notes)"; continue; }
          if jq -n --rawfile body "$f" '{body: $body}' | gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - >/dev/null; then
            echo "updated $tag (release $id)"
          else
            echo "::error::failed to update $tag (release $id)"; failed=1
          fi
        done < releases.txt
        exit $failed
