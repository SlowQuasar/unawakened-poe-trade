name: Release notes

# Sync release-notes/<tag>.md into the body of already published GitHub Releases.
on:
  push:
    branches:
      - 'master'
    paths:
      - 'release-notes/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # edit release bodies
    steps:
    - uses: actions/checkout@v6
    - name: Remove duplicate blockmap-only releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # An upload race once created a second release for one tag holding only
        # a .blockmap. Delete such a release by id, but only while another
        # release for the same tag still carries an installer (.exe).
        gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > all.json
        jq -r 'group_by(.tag_name)[] | select(length > 1)
          | select(any(.[]; any(.assets[]; .name | endswith(".exe"))))
          | .[] | select(all(.assets[]; .name | endswith(".blockmap")))
          | "\(.id) \(.tag_name) \([.assets[].name] | join(","))"' all.json |
        while read -r id tag assets; do
          echo "deleting duplicate release $id ($tag: $assets)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
        done
    - name: Update release bodies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Edit by release id: a tag can have more than one release.
        failed=0
        gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | "\(.id) \(.tag_name)"' > releases.txt
        while read -r id tag; do
          f="release-notes/$tag.md"
          [ -f "$f" ] || { echo "skip $tag (no notes)"; continue; }
          if jq -n --rawfile body "$f" '{body: $body}' | gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - >/dev/null; then
            echo "updated $tag (release $id)"
          else
            echo "::error::failed to update $tag (release $id)"; failed=1
          fi
        done < releases.txt
        exit $failed
