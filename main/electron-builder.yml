# Publish/update ONLY to our own repository. Never infer it from package.json.
publish:
  - provider: "github"
    owner: "SlowQuasar"
    repo: "unawakened-poe-trade"
    releaseType: "draft"
appId: "io.github.slowquasar.unawakened-poe-trade"
productName: "Unawakened PoE Trade"
npmRebuild: false
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
# MIT: ship the license and third-party notices with every copy
extraFiles:
  - from: "../LICENSE"
    to: "LICENSE.txt"
  - from: "build/THIRD_PARTY_NOTICES.txt"
    to: "THIRD_PARTY_NOTICES.txt"
extraMetadata:
  main: "main.js"
nsis:
  artifactName: "Unawakened-PoE-Trade-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: "Unawakened-PoE-Trade-${version}.${ext}"
win:
  icon: "build/icons/icon.ico"
  # Kakao PoE client runs elevated; the overlay must too (UIPI)
  requestedExecutionLevel: "requireAdministrator"
  target:
  - "nsis"
  - "portable"
