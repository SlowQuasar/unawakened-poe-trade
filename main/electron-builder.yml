# Publish/update ONLY to our own repository. Never infer it from package.json.
publish:
  - provider: "github"
    owner: "SlowQuasar"
    repo: "unawakened-poe-trade"
appId: "io.github.slowquasar.unawakened-poe-trade"
productName: "Unawakened PoE Trade"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
nsis:
  artifactName: "Unawakened-PoE-Trade-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: "Unawakened-PoE-Trade-${version}.${ext}"
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
